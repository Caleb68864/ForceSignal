name: verify

# scripts/verify.ps1 is the gate the README tells a human to run. This runs it on every push and
# pull request so it is no longer a matter of remembering. The script is PowerShell, which the
# Ubuntu runner ships as pwsh; Docker is present for the compose config validation step.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ForceSignal.Web/package-lock.json
      # -IncludeDocker builds the images, brings the compose stack up and runs docker-smoke.ps1
      # against it. Without it the gate never once asserted that the volume and the configured
      # database path actually take effect - readiness reporting "sqlite" rather than falling back
      # to memory - which is the difference between a restart resuming the game and ending it. It
      # is also the only place the assembled nginx response headers are read rather than inferred.
      # The Ubuntu runner ships Docker and Compose, so there is no reason it was ever skipped.
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1 -IncludeDocker
