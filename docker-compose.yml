services:
  api:
    build:
      context: .
      dockerfile: src/ForceSignal.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${FORCESIGNAL_WEB_ORIGIN:-http://localhost:6297}
      # Matches live on the volume below, so restarting the container - or the machine - resumes the
      # game instead of ending it.
      Persistence__MatchDatabasePath: /var/lib/forcesignal/matches.db
    ports:
      - "8080:8080"
    volumes:
      - match-data:/var/lib/forcesignal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/ForceSignal.Web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "6297:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  # Named rather than a bind mount so it survives `docker compose down` and does not depend on a
  # path existing on the host.
  match-data:
