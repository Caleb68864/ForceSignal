services:
  api:
    build:
      context: .
      dockerfile: src/ForceSignal.Api/Dockerfile
    # Every setting an operator is told to change is interpolated from a named variable, so a value
    # put in .env reaches the container. Compose does not pass .env through to a service by itself:
    # it only substitutes it into this file, which is why nothing here is a bare literal. Anything
    # added below needs a matching name in .env.example - scripts/check-deployment-config.py fails
    # the build if the two drift, because a documented knob that turns nothing is worse than none.
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${FORCESIGNAL_WEB_ORIGIN:-http://localhost:6297}
      # Matches live on the volume below, so restarting the container - or the machine - resumes the
      # game instead of ending it. Point it somewhere else only if you have mounted somewhere else.
      Persistence__MatchDatabasePath: ${FORCESIGNAL_MATCH_DB:-/var/lib/forcesignal/matches.db}
      # Off unless the operator says there is a proxy in front: X-Forwarded-For is a claim any
      # caller can make, and believing it without one hands out the per-client rate limits.
      Proxy__TrustForwardedHeaders: ${FORCESIGNAL_TRUST_FORWARDED_HEADERS:-false}
      # The ground-combat engines are built alongside the working game and are off until asked for.
      Features__StarGrunt: ${FORCESIGNAL_FEATURES_STARGRUNT:-false}
      Features__Dirtside: ${FORCESIGNAL_FEATURES_DIRTSIDE:-false}
    ports:
      - "8080:8080"
    volumes:
      - match-data:/var/lib/forcesignal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/ForceSignal.Web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "6297:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  # Named rather than a bind mount so it survives `docker compose down` and does not depend on a
  # path existing on the host.
  match-data:
