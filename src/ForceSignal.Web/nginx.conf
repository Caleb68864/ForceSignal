server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.inc;

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        access_log off;
        # The include has to come before this location's own add_header lines for the same reason it
        # is repeated at all: nginx inherits a parent's headers only while a location adds none of
        # its own, and Content-Type below is one of its own. A probe endpoint is still a response
        # this origin served, so it carries the same headers as everything else.
        include /etc/nginx/security-headers.inc;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, immutable";
    }
}
